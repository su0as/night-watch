[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "night-watch"
version = "0.1.0"
description = "Sleep while your robot learns. Open models watch the training run and only wake you when it matters."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Suhas Suren" }]
dependencies = [
  "numpy>=1.24",
  "pillow>=10",
  "requests>=2.31",
  "psutil>=5.9",
]

[project.optional-dependencies]
train = ["gymnasium[mujoco]>=1.0", "stable-baselines3>=2.3"]
tabpfn = ["tabpfn>=7", "scikit-learn>=1.3"]
temporal = ["temporalio>=1.7"]
plots = ["matplotlib>=3.7"]
sentry = ["sentry-sdk>=2.0"]
dev = ["pytest>=8"]
all = [
  "gymnasium[mujoco]>=1.0", "stable-baselines3>=2.3",
  "tabpfn>=7", "scikit-learn>=1.3",
  "temporalio>=1.7", "matplotlib>=3.7", "sentry-sdk>=2.0", "pytest>=8",
]

[project.scripts]
night-watch = "nightwatch.cli:main"

[tool.setuptools.packages.find]
include = ["nightwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
